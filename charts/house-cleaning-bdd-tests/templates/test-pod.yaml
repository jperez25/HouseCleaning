apiVersion: v1
kind: Pod
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: {{ .Values.test.activeDeadlineSeconds }}
  containers:
    - name: tests
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: TEST_BASE_URL
          value: {{ .Values.target.baseUrl | quote }}
      {{- with .Values.test.extraArgs }}
      args:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.results.hostPath }}
      volumeMounts:
        - name: allure-results
          mountPath: /allure-results
      {{- end }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  {{- if .Values.results.hostPath }}
  volumes:
    - name: allure-results
      hostPath:
        path: {{ .Values.results.hostPath | quote }}
        type: DirectoryOrCreate
  {{- end }}
