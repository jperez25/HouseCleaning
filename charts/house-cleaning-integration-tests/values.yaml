# Shared defaults for every environment. Override per environment with values-<env>.yaml.
# The release deploys nothing by itself: the test pod is a Helm test hook, run with `helm test <release>`.
image:
  repository: house-cleaning-integration-tests
  tag: local
  pullPolicy: IfNotPresent       # image is loaded with "minikube image load"

target:
  baseUrl: http://house-cleaning-app:8080   # the deployed app Service (exported to the pod as TEST_BASE_URL)

test:
  activeDeadlineSeconds: 600
  extraArgs: []                  # extra Maven arguments, e.g. ["-Dcucumber.filter.tags=@smoke"]

# Email a summary table (total, passed, failed, time) after the run. Off by default.
# The report URL is a mock: nothing is uploaded, the link is built from report.baseUrl.
report:
  sendEmail: false
  baseUrl: https://reports.example.com/house-cleaning
# SMTP settings used when report.sendEmail=true. Placeholders: replace them (or override per environment).
mail:
  host: smtp.example.com
  port: 587                      # 465 = implicit TLS, otherwise STARTTLS (unless starttls: false)
  starttls: true
  from: house-cleaning-ci@example.com
  to: team@example.com
  username: ""                   # empty = no SMTP auth
  password: ""                   # DEV ONLY: stored in a Secret created by this chart. Do not commit real passwords:
  credentialsSecret: ""          #   use an existing Secret with keys "username" and "password" instead

results:
  hostPath: ""                   # node directory that receives the Allure results (empty = not collected)

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi
